{% macro ico(name) -%}
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  {%- if name == 'mail' -%}
  <path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>
  {%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 8h.01"/>
  {%- elif name == 'tag' -%}
  <path d="M12 3H5v7l8.5 8.5a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8z"/><circle cx="8.5" cy="8.5" r="1"/>
  {%- elif name == 'book' -%}
  <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"/><path d="M5 4v16"/>
  {%- elif name == 'home' -%}
  <path d="m4 11 8-7 8 7"/><path d="M6 10v9h12v-9"/>
  {%- elif name == 'arrow' -%}
  <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
  {%- elif name == 'refresh' -%}
  <path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 4v6h-6"/>
  {%- elif name == 'folders' -%}
  <path d="M3 7h6l2 2h10v9H3z"/><path d="M3 11h18"/>
  {%- elif name == 'server' -%}
  <rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>
  {%- elif name == 'cloud' -%}
  <path d="M7 18h10a4 4 0 0 0 .4-8 6 6 0 0 0-11.5-1.5A3.5 3.5 0 0 0 7 18z"/>
  {%- elif name == 'spark' -%}
  <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>
  {%- elif name == 'layout' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>
  {%- elif name == 'globe' -%}
  <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/>
  {%- elif name == 'key' -%}
  <circle cx="8" cy="14" r="4"/><path d="M11.5 12.5 20 4l-2 2M16 6l2 2"/>
  {%- elif name == 'swap' -%}
  <path d="M7 7h11l-3-3M17 17H6l3 3"/>
  {%- elif name == 'eye' -%}
  <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>
  {%- elif name == 'play' -%}
  <path d="m8 6 10 6-10 6z"/>
  {%- elif name == 'stop' -%}
  <rect x="7" y="7" width="10" height="10" rx="1.5"/>
  {%- elif name == 'check' -%}
  <path d="m5 12 5 5L20 7"/>
  {%- elif name == 'shield' -%}
  <path d="M12 3 5 6v6c0 4.5 3 7 7 9 4-2 7-4.5 7-9V6z"/>
  {%- else -%}
  <circle cx="12" cy="12" r="8"/>
  {%- endif -%}
</svg>
{%- endmacro %}
